name: Validate Serial 0.4.0 Release Pin
on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-040-release-pin.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Flowduino/ESPressio-Command
          ref: 0.2.0
          path: deps/ESPressio-Command
      - name: Validate and report
        shell: bash
        run: |
          set +e
          {
            echo '=== CONFIGURE ==='
            cmake -S tests -B build -DESPRESSIO_COMMAND_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Command/src"
            c1=$?
            echo "configure_exit=$c1"
            if [ $c1 -eq 0 ]; then
              echo '=== BUILD ==='
              cmake --build build --parallel
              c2=$?
            else c2=99; fi
            echo "build_exit=$c2"
            if [ $c1 -eq 0 ] && [ $c2 -eq 0 ]; then
              echo '=== TEST ==='
              ctest --test-dir build --output-on-failure
              c3=$?
            else c3=99; fi
            echo "test_exit=$c3"
          } > validation.txt 2>&1
          cat validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .ci
          mv validation.txt .ci/serial-040-release-pin.txt
          git add -- .ci/serial-040-release-pin.txt
          git commit -m "chore: record Serial 0.4.0 release-pin validation"
          git push origin HEAD:main
