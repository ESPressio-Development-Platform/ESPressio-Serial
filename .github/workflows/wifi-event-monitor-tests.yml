name: Final Diagnostics Contract

on:
  push:
  pull_request:

jobs:
  ownership-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject predecessor diagnostic ownership
        shell: bash
        run: |
          test ! -e src/ESPressio_WiFiEventMonitor.hpp
          test ! -e src/wifi/ESPressio_WiFiEventMonitor.hpp
          test ! -e src/ESPressio_ESPNowTransportMonitor.hpp
          test ! -e src/espnow/ESPressio_ESPNowTransportMonitor.hpp
          test ! -e src/ESPressio_SocketWorkerMonitor.hpp
          test ! -e src/sockets/ESPressio_SocketWorkerMonitor.hpp
          grep -q 'ESPressio_IThread.hpp' src/threads/ESPressio_ThreadMonitor.hpp
          grep -q 'GetDiagnostics' src/threads/ESPressio_ThreadMonitor.hpp
          grep -q 'TimeReliability' src/timing/ESPressio_SystemClockMonitor.hpp
          grep -q 'ClockSynchronizationProfile' src/timing/ESPressio_SystemClockMonitor.hpp
          grep -q 'ESPressio_ESPNowRadio.hpp' src/espnow/ESPressio_ESPNowRadioMonitor.hpp
          grep -q 'AcceptedIngressPackets' src/espnow/ESPressio_ESPNowRadioMonitor.hpp
          grep -q 'ESPressio_SocketAdapterTransport.hpp' src/sockets/ESPressio_SocketAdapterTransportMonitor.hpp
          grep -q 'Generation()' src/sockets/ESPressio_SocketAdapterTransportMonitor.hpp
          grep -q 'IWiFiObserver' src/wifi/ESPressio_WiFiMonitor.hpp
          if grep -R -E 'ThreadManager|ESPNowTransport|SocketWorker|EventThread|WiFiEvents' \
              src/threads/ESPressio_ThreadMonitor.hpp \
              src/timing/ESPressio_SystemClockMonitor.hpp \
              src/espnow/ESPressio_ESPNowRadioMonitor.hpp \
              src/sockets/ESPressio_SocketAdapterTransportMonitor.hpp \
              src/wifi/ESPressio_WiFiMonitor.hpp; then
            echo 'Final Serial diagnostics must not reacquire predecessor runtime ownership.' >&2
            exit 1
          fi

  esp32-wifi-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: project/ESPressio-Serial}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-System, ref: primitives_redesign, path: project/dependencies/ESPressio-System}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Task, ref: primitives_redesign, path: project/dependencies/ESPressio-Task}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Observable, ref: primitives_redesign, path: project/dependencies/ESPressio-Observable}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Serializable, ref: primitives_redesign, path: project/dependencies/ESPressio-Serializable}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Units, ref: primitives_redesign, path: project/dependencies/ESPressio-Units}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Timing, ref: primitives_redesign, path: project/dependencies/ESPressio-Timing}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Threads, ref: primitives_redesign, path: project/dependencies/ESPressio-Threads}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-WiFi, ref: primitives_redesign, path: project/dependencies/ESPressio-WiFi}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: pip install platformio
      - name: Create final WiFi monitor consumer
        shell: bash
        run: |
          mkdir -p project/compile/src
          cat > project/compile/platformio.ini <<'EOF'
          [env:esp32]
          platform = espressif32
          board = esp32dev
          framework = arduino
          build_flags = -std=gnu++17 -fno-rtti
          build_unflags = -std=gnu++11 -frtti
          lib_ldf_mode = deep+
          lib_deps =
              ../dependencies/ESPressio-System
              ../dependencies/ESPressio-Task
              ../dependencies/ESPressio-Observable
              ../dependencies/ESPressio-Serializable
              ../dependencies/ESPressio-Units
              ../dependencies/ESPressio-Timing
              ../dependencies/ESPressio-Threads
              ../dependencies/ESPressio-WiFi
              ../ESPressio-Serial
          EOF
          cat > project/compile/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <ESPressio_WiFi.hpp>
          #include <ESPressio_WiFiMonitor.hpp>
          ESPressio::Serial::WiFiMonitor monitor;
          void setup() { Serial.begin(115200); }
          void loop() { delay(1000); }
          EOF
      - name: Compile final WiFi diagnostics seam
        run: pio run -d project/compile
