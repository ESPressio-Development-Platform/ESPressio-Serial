name: WiFi Event Monitor

on:
  push:
  pull_request:

jobs:
  esp32-wifi-event-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: project/ESPressio-Serial
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Observable, ref: 3.0.2, path: project/dependencies/ESPressio-Observable}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Serializable, ref: 0.11.3, path: project/dependencies/ESPressio-Serializable}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Units, ref: 0.2.7, path: project/dependencies/ESPressio-Units}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Timing, ref: 2.2.8, path: project/dependencies/ESPressio-Timing}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Threads, ref: 3.1.7, path: project/dependencies/ESPressio-Threads}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Event, ref: 6.0.3, path: project/dependencies/ESPressio-Event}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-WiFi, ref: 0.2.0, path: project/dependencies/ESPressio-WiFi}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install platformio
      - name: Create WiFi Event monitor consumer
        shell: bash
        run: |
          mkdir -p project/compile/src
          cat > project/compile/platformio.ini <<'EOF'
          [env:esp32]
          platform = espressif32
          board = esp32dev
          framework = arduino
          build_flags = -std=gnu++17 -frtti
          build_unflags = -std=gnu++11 -fno-rtti
          lib_ldf_mode = deep+
          lib_deps =
              ../dependencies/ESPressio-Observable
              ../dependencies/ESPressio-Serializable
              ../dependencies/ESPressio-Units
              ../dependencies/ESPressio-Timing
              ../dependencies/ESPressio-Threads
              ../dependencies/ESPressio-Event
              ../dependencies/ESPressio-WiFi
              ../ESPressio-Serial
          EOF
          cat > project/compile/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <ESPressio_WiFiEvents.hpp>
          #include <ESPressio_WiFiEventMonitor.hpp>

          ESPressio::Serial::WiFiEventMonitor wifiEvents(Serial);

          void setup() { Serial.begin(115200); }
          void loop() { delay(1000); }
          EOF
      - name: Compile all WiFi Event -> Serial registrations
        run: pio run -d project/compile
