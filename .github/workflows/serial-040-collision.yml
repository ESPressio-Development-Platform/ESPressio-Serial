name: Serial 0.4.0 Collision Safety
on:
  push:
    branches: [main]
    paths: ['.github/workflows/serial-040-collision.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/event-console/ESPressio_EventConsole.hpp'); s=p.read_text()
          old='''        _eventCommandRegistration = registry->RegisterCommand("event");\n        auto& event = registry->Command("event").Description("Serializable Event discovery, description, composition and dispatch");'''
          new='''        _eventCommandRegistration = registry->RegisterCommand("event");\n        if (!_eventCommandRegistration.Active()) { Shutdown(); return false; }\n        auto& event = registry->Command("event").Description("Serializable Event discovery, description, composition and dispatch");'''
          if old not in s: raise SystemExit('event registration pattern missing')
          s=s.replace(old,new,1)
          old='''        _eventsCommandRegistration = registry->RegisterCommand("events");\n        registry->Command("events").Description("List runtime-registered Serializable Events").OnExecute'''
          new='''        _eventsCommandRegistration = registry->RegisterCommand("events");\n        if (!_eventsCommandRegistration.Active()) { Shutdown(); return false; }\n        registry->Command("events").Description("List runtime-registered Serializable Events").OnExecute'''
          if old not in s: raise SystemExit('events registration pattern missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/event-console/ESPressio_EventConsole.hpp
          git commit -m "fix: reject Command root ownership collisions"
          git push origin HEAD:main
