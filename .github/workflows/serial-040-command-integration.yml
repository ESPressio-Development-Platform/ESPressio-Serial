name: Serial 0.4.0 Command Integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/serial-040-command-integration.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply EventConsole Command integration and release metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('src/event-console/ESPressio_EventConsole.hpp')
          s=p.read_text()
          s=s.replace('#include <ESPressio_JsonArchive.hpp>\n', '#include <ESPressio_JsonArchive.hpp>\n#include <ESPressio_Command.hpp>\n\n#include "../command-console/ESPressio_CommandConsole.hpp"\n', 1)
          field='    uint32_t _interceptorID = 0;\n'
          s=s.replace(field, field+'\n    Command::CommandRegistrationHandle _eventCommandRegistration;\n    Command::CommandRegistrationHandle _eventsCommandRegistration;\n    bool _commandBacked = false;\n',1)
          public_marker='public:\n    EventConsole() = default;'
          overload='''public:\n    bool Initialize(\n        CommandConsole& commandConsole,\n        const EventConsoleConfig& config = {},\n        Event::EventTransportManager& manager = Event::EventTransportManager::GetInstance()\n    ) {\n        Shutdown();\n        Console* console = commandConsole.GetConsole();\n        Command::CommandRegistry* registry = commandConsole.GetRegistry();\n        if (console == nullptr || registry == nullptr || console->GetOutput() == nullptr) return false;\n\n        _console = console;\n        _output = console->GetOutput();\n        _manager = &manager;\n        _config = config;\n        _commandBacked = true;\n\n        _eventCommandRegistration = registry->RegisterCommand("event");\n        auto& event = registry->Command("event").Description("Serializable Event discovery, description, composition and dispatch");\n\n        event.Command("list").Description("List runtime-registered Serializable Events").OnExecute([this](const Command::CommandContext&) { ListEvents(); return Command::CommandResult::Ok(); });\n        auto& describe = event.Command("describe").Description("Describe a runtime-registered Serializable Event");\n        describe.Parameter<std::string>("type").Description("Stable Event type name");\n        describe.OnExecute([this](const Command::CommandContext& c) { DescribeEvent(c.Get<std::string>("type")); return Command::CommandResult::Ok(); });\n\n        event.Command("cancel").Description("Cancel a pending Event composition/dispatch").OnExecute([this](const Command::CommandContext&) { std::lock_guard<std::mutex> lock(_mutex); CancelPending("Pending Event operation cancelled."); return Command::CommandResult::Ok(); });\n\n        auto& compose = event.Command("compose").Description("Interactively compose a Serializable Event");\n        compose.Parameter<std::string>("type").Description("Stable Event type name");\n        compose.Parameter<std::string>("method").Optional().Default("queue").OneOf({"queue", "stack"});\n        compose.OnExecute([this](const Command::CommandContext& c) { std::string args = c.Get<std::string>("type") + " " + c.Get<std::string>("method"); std::lock_guard<std::mutex> lock(_mutex); BeginCompose(args); return Command::CommandResult::Ok(); });\n\n        auto registerDispatch = [this, &event](const char* name, Event::EventDispatchMethod method) {\n            auto& node = event.Command(name).Description(std::string("Dispatch a Serializable Event via ") + (method == Event::EventDispatchMethod::Stack ? "Stack" : "Queue"));\n            node.Parameter<std::string>("type").Description("Stable Event type name");\n            node.Parameter<std::string>("json").Description("One-line JSON payload");\n            node.OnExecute([this, method](const Command::CommandContext& c) {\n                if ((method == Event::EventDispatchMethod::Queue && !_config.AllowQueue) || (method == Event::EventDispatchMethod::Stack && !_config.AllowStack)) return Command::CommandResult::Error("Requested dispatch method is disabled");\n                std::lock_guard<std::mutex> lock(_mutex);\n                ConstructAndDispatch(c.Get<std::string>("type"), c.Get<std::string>("json"), method);\n                return Command::CommandResult::Ok();\n            });\n        };\n        registerDispatch("queue", Event::EventDispatchMethod::Queue);\n        registerDispatch("stack", Event::EventDispatchMethod::Stack);\n        registerDispatch("dispatch", Event::EventDispatchMethod::Queue);\n\n        _eventsCommandRegistration = registry->RegisterCommand("events");\n        registry->Command("events").Description("List runtime-registered Serializable Events").OnExecute([this](const Command::CommandContext&) { ListEvents(); return Command::CommandResult::Ok(); });\n\n        _interceptorID = console->RegisterLineInterceptor([this](std::string_view line) { return HandleInteractiveLine(line); });\n        if (_interceptorID == 0) { Shutdown(); return false; }\n        return true;\n    }\n\n    EventConsole() = default;'''
          s=s.replace(public_marker,overload,1)
          s=s.replace('        if (_console != nullptr) {\n            _console->\n                UnregisterCommand(', '        if (_console != nullptr && !_commandBacked) {\n            _console->\n                UnregisterCommand(',1)
          marker='        _interceptorID = 0;\n        _console = nullptr;'
          s=s.replace(marker,'        _eventCommandRegistration.Reset();\n        _eventsCommandRegistration.Reset();\n        _commandBacked = false;\n        _interceptorID = 0;\n        _console = nullptr;',1)
          p.write_text(s)

          # Public/version metadata
          j=Path('library.json'); data=json.loads(j.read_text()); data['version']='0.4.0'; data['description']='Serial and console-oriented components for ESPressio, including opt-in ESPressio Command and Event integrations.'; j.write_text(json.dumps(data,indent=4)+'\n')
          lp=Path('library.properties'); txt=lp.read_text().replace('version=0.3.3','version=0.4.0'); lp.write_text(txt)
          cm=Path('component.mk'); txt=cm.read_text().replace('VERSION_MINOR=3','VERSION_MINOR=4').replace('VERSION_PATCH=3','VERSION_PATCH=0').replace('VERSION_STRING=\\"0.3.3\\"','VERSION_STRING=\\"0.4.0\\"'); cm.write_text(txt)
          umbrella=Path('src/ESPressio_Serial.hpp'); txt=umbrella.read_text().replace('ESPressio_DiagnosticMonitor.hpp. */','ESPressio_DiagnosticMonitor.hpp, ESPressio_CommandConsole.hpp, or ESPressio_EventConsole.hpp. */'); umbrella.write_text(txt)

          ch=Path('CHANGELOG.md'); txt=ch.read_text(); ch.write_text('## 0.4.0\n\n- Added optional ESPressio Command 0.2.x integration through `CommandConsole`.\n- Added a Command-backed EventConsole initialization path and registered `event`/`events` command trees.\n- Preserved the legacy Console registration path for backward compatibility.\n- Added scoped Command registration cleanup during EventConsole shutdown.\n- Updated integration guidance for the current ESPressio dependency generation.\n\n'+txt)

          readme=Path('README.md'); txt=readme.read_text().replace('**0.3.3**','**0.4.0**',1).replace('flowduino/ESPressio-Serial@^0.3.3','flowduino/ESPressio-Serial@^0.4.0')
          section='''\n\n## ESPressio Command Integration (0.4.0)\n\nSerial 0.4.0 adds an opt-in bridge to **ESPressio Command >= 0.2.0 < 1.0.0**. Core Serial remains usable without Command. Include `ESPressio_CommandConsole.hpp` only when the integration is required.\n\n```ini\nlib_deps =\n    flowduino/ESPressio-Serial@^0.4.0\n    flowduino/ESPressio-Command@^0.2.0\n```\n\n```cpp\n#include <ESPressio_Console.hpp>\n#include <ESPressio_CommandConsole.hpp>\n#include <ESPressio_Commands.hpp>\n\nESPressio::Serial::Console console;\nESPressio::Serial::CommandConsole commandConsole;\n\nvoid setup() {\n    console.Initialize(Serial, Serial);\n    commandConsole.Initialize(console);\n\n    auto& commands = ESPressio::Command::CommandRegistry::GetInstance();\n    commands.Command("system").Command("status")\n        .OnExecute([](const ESPressio::Command::CommandContext&) {\n            return ESPressio::Command::CommandResult::Ok("System OK");\n        });\n}\n\nvoid loop() { console.Poll(); }\n```\n\n`CommandConsole` reuses Serial's existing input/prompt handling and forwards resolvable lines into the shared transport-neutral Command registry. Unknown roots fall through so other Console interceptors and legacy commands can continue to coexist.\n\n### EventConsole on the shared Command tree\n\nWhen Command integration is selected, initialize EventConsole with `CommandConsole`:\n\n```cpp\nESPressio::Serial::EventConsole eventConsole;\neventConsole.Initialize(commandConsole);\n```\n\nEventConsole then registers the following shared Command tree with ownership-safe registration handles:\n\n```text\nevent list\nevent describe <type>\nevent compose <type> [queue|stack]\nevent queue <type> <json>\nevent stack <type> <json>\nevent dispatch <type> <json>\nevent cancel\nevents\n```\n\nShutdown removes the registered subtrees, preventing callbacks from outliving the EventConsole instance. The previous `Initialize(Console&, ...)` overload remains available for compatibility with existing applications.\n'''
          txt += section
          readme.write_text(txt)
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/event-console/ESPressio_EventConsole.hpp src/ESPressio_Serial.hpp library.json library.properties component.mk CHANGELOG.md README.md
          git commit -m "feat: integrate ESPressio Command console and EventConsole"
          git push origin HEAD:main
