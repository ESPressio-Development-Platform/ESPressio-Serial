name: Prepare Serial 0.7.3 release
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  prepare:
    if: github.head_ref == 'release/30-0.7.3-repository-relocation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/30-0.7.3-repository-relocation
      - name: Prepare release documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md'); t=p.read_text()
          reps=[('## Current Version — 0.7.2','## Current Version — 0.7.3'),('Version **0.7.2** is a dependency-maintenance patch release over 0.7.1. It raises Serial\'s validated optional ESP-Now monitor baseline to released ESP-Now 0.8.0, preserving all Serial public interfaces and runtime semantics.','Version **0.7.3** is the repository-relocation dependency patch for the Serial 0.7 generation, validating every optional integration against the migrated ESPressio release stack while preserving all Serial public interfaces and runtime semantics.'),('Command >= 1.0.0 < 2.0.0','Command >= 1.0.1 < 2.0.0'),('Security >= 0.3.0 < 1.0.0','Security >= 0.3.1 < 1.0.0'),('Sockets >= 0.7.0 < 1.0.0','Sockets >= 0.7.1 < 1.0.0'),('ESP-Now >= 0.8.0 < 1.0.0','ESP-Now >= 0.8.1 < 1.0.0'),('Timing >= 2.2.4 < 3.0.0','Timing >= 2.2.5 < 3.0.0'),('Threads >= 3.1.4 < 4.0.0','Threads >= 3.1.5 < 4.0.0'),('Event >= 6.0.0 < 7.0.0','Event >= 6.0.1 < 7.0.0'),('Serializable >= 0.10.2 < 1.0.0','Serializable >= 0.10.3 < 1.0.0'),('Observable    3.0.1','Observable    3.0.2'),('Serializable  0.10.2','Serializable  0.10.3'),('Units         0.2.3','Units         0.2.4'),('Timing        2.2.4','Timing        2.2.5'),('Threads       3.1.4','Threads       3.1.5'),('Command       1.0.0','Command       1.0.1'),('Security      0.3.0','Security      0.3.1'),('Event         6.0.0','Event         6.0.1'),('Sockets       0.7.0','Sockets       0.7.1'),('ESP-Now       0.8.0','ESP-Now       0.8.1'),('Serial        0.7.2','Serial        0.7.3'),('ESPressio-Serial@^0.7.2','ESPressio-Serial@^0.7.3'),('ESPressio-Command@^1.0.0','ESPressio-Command@^1.0.1'),('ESPressio-Security@^0.3.0','ESPressio-Security@^0.3.1'),('ESPressio-Sockets@^0.7.0','ESPressio-Sockets@^0.7.1'),('ESPressio-ESP-Now@^0.8.0','ESPressio-ESP-Now@^0.8.1'),('ESPressio-Event@^6.0.0','ESPressio-Event@^6.0.1'),('ESPressio-Serializable@^0.10.2','ESPressio-Serializable@^0.10.3'),('ESPressio-Timing@^2.2.4','ESPressio-Timing@^2.2.5'),('ESPressio-Threads@^3.1.4','ESPressio-Threads@^3.1.5'),('ESPressio-Observable@^3.0.1','ESPressio-Observable@^3.0.2'),('ESPressio-Units@^0.2.3','ESPressio-Units@^0.2.4')]
          for a,b in reps: t=t.replace(a,b)
          p.write_text(t)
          p=Path('CHANGELOG.md'); t=p.read_text(); entry='''## 0.7.3 — 2026-08-22\n\n### Changed\n- Published the post-migration ESPressio Serial package generation from `ESPressio-Development-Platform`.\n- Raised optional Command to `>=1.0.1 <2.0.0`, Security to `>=0.3.1 <1.0.0`, Sockets to `>=0.7.1 <1.0.0`, ESP-Now to `>=0.8.1 <1.0.0`, Event to `>=6.0.1 <7.0.0`, Serializable to `>=0.10.3 <1.0.0`, Timing to `>=2.2.5 <3.0.0`, and Threads to `>=3.1.5 <4.0.0`.\n- Updated package metadata, operator/integration documentation, CI validation, and dependency documentation for the complete migrated release generation.\n\n### Compatibility\n- No Serial public API or runtime behaviour changes are introduced by this repository-relocation patch release. Core Serial remains free of mandatory ESPressio dependencies.\n\n''';
          if '## 0.7.3' not in t: t=t.replace('# Changelog\n\n','# Changelog\n\n'+entry,1)
          p.write_text(t)
          reps2=[('Observable    3.0.1','Observable    3.0.2'),('Observable 3.0.1','Observable 3.0.2'),('Serializable  0.10.2','Serializable  0.10.3'),('Serializable 0.10.2','Serializable 0.10.3'),('Units         0.2.3','Units         0.2.4'),('Units 0.2.3','Units 0.2.4'),('Timing        2.2.4','Timing        2.2.5'),('Timing 2.2.4','Timing 2.2.5'),('Threads       3.1.4','Threads       3.1.5'),('Threads 3.1.4','Threads 3.1.5'),('Event         6.0.0','Event         6.0.1'),('Event 6.0.0','Event 6.0.1'),('Command       1.0.0','Command       1.0.1'),('Command 1.0.0','Command 1.0.1'),('Security      0.3.0','Security      0.3.1'),('Security 0.3.0','Security 0.3.1'),('Sockets       0.7.0','Sockets       0.7.1'),('Sockets 0.7.0','Sockets 0.7.1'),('ESP-Now       0.8.0','ESP-Now       0.8.1'),('ESP-Now 0.8.0','ESP-Now 0.8.1'),('Serial        0.7.2','Serial        0.7.3'),('Serial 0.7.2','Serial 0.7.3'),('Command >= 1.0.0','Command >= 1.0.1'),('Security >= 0.3.0','Security >= 0.3.1'),('Sockets >= 0.7.0','Sockets >= 0.7.1'),('ESP-Now >= 0.8.0','ESP-Now >= 0.8.1'),('Event >= 6.0.0','Event >= 6.0.1'),('Serializable >= 0.10.2','Serializable >= 0.10.3'),('Timing >= 2.2.4','Timing >= 2.2.5'),('Threads >= 3.1.4','Threads >= 3.1.5')]
          for f in ['ESPRESSIO_DEPENDENCY_CHART.md','ESPRESSIO_DEPENDENCY_CHART.svg']:
              p=Path(f); t=p.read_text()
              for a,b in reps2: t=t.replace(a,b)
              p.write_text(t)
          PY
      - name: Commit release preparation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md ESPRESSIO_DEPENDENCY_CHART.md ESPRESSIO_DEPENDENCY_CHART.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Prepare Serial 0.7.3 release documentation (#30)'
          git push
