name: Dependency documentation maintenance

on:
  push:
    branches:
      - feature/8-dependency-refresh-0.5.1

permissions:
  contents: write

jobs:
  update-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update current release references
        shell: python
        run: |
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text()
          replacements = {
              "Version **0.5.1** fixes the structured EventMonitor crash path reproduced on ESP32 under low-memory conditions. Structured diagnostics now use ESPressio Serializable 0.10.1's allocation-free BinaryArchive traversal API": "Version **0.5.1** fixes the structured EventMonitor crash path reproduced on ESP32 under low-memory conditions. Structured diagnostics now use ESPressio Serializable 0.10.2's allocation-free BinaryArchive traversal API",
              'ESPressio ESP-Now >= 0.5.1 < 1.0.0': 'ESPressio ESP-Now >= 0.5.2 < 1.0.0',
              'Event-backed observation remains a separate opt-in integration in ESPressio Event 5.8.1.': 'Event-backed observation remains a separate opt-in integration in ESPressio Event 5.8.2.',
              'Current coordinated dependency baselines for the 0.5.1 release are Units 0.2.2, Timing 2.2.3, Threads 3.1.3, ESP-Now 0.5.1, Event 5.8.1, and Serializable 0.10.1.': 'Current coordinated dependency baselines for the 0.5.1 release are Units 0.2.3, Timing 2.2.4, Threads 3.1.4, ESP-Now 0.5.2, Event 5.8.2, and Serializable 0.10.2.',
              'ESPressio Event >= 5.8.1 < 6.0.0\nESPressio Serializable >= 0.10.1 < 1.0.0': 'ESPressio Event >= 5.8.2 < 6.0.0\nESPressio Serializable >= 0.10.2 < 1.0.0'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected README text: {old}')
              text = text.replace(old, new, 1)
          readme.write_text(text)

          changelog = Path('CHANGELOG.md')
          current = changelog.read_text()
          replacements = {
              "allocation-free ESPB traversal from ESPressio Serializable 0.10.1": "allocation-free ESPB traversal from ESPressio Serializable 0.10.2",
              'ESPressio Serializable >= 0.10.1 < 1.0.0': 'ESPressio Serializable >= 0.10.2 < 1.0.0',
              'Units 0.2.2, Timing 2.2.3, Threads 3.1.3, ESP-Now 0.5.1, Event 5.8.1, and released Serializable 0.10.1': 'Units 0.2.3, Timing 2.2.4, Threads 3.1.4, ESP-Now 0.5.2, Event 5.8.2, and released Serializable 0.10.2',
              'ESPressio Event >= 5.8.1 < 6.0.0': 'ESPressio Event >= 5.8.2 < 6.0.0',
              'ESPressio ESP-Now >= 0.5.1 < 1.0.0': 'ESPressio ESP-Now >= 0.5.2 < 1.0.0',
              'completed Serializable 0.10.1 dependency cascade': 'completed Serializable 0.10.2 dependency cascade'
          }
          for old, new in replacements.items():
              if old not in current:
                  raise SystemExit(f'Missing expected CHANGELOG text: {old}')
              current = current.replace(old, new, 1)
          marker = '- Updated current documentation and CI to consume the completed Serializable 0.10.2 dependency cascade rather than intermediate bug-fix commits.\n'
          note = '- Serializable 0.10.2 also resolves the strict-build `-Wmisleading-indentation` warning exposed by Serial\'s warnings-as-errors host validation.\n'
          if note not in current:
              current = current.replace(marker, marker + note, 1)
          changelog.write_text(current)
      - name: Commit documentation update
        shell: bash
        run: |
          if git diff --quiet -- README.md CHANGELOG.md; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md CHANGELOG.md
          git commit -m 'docs: refresh Serial 0.5.1 dependency references (#8)'
          git push
