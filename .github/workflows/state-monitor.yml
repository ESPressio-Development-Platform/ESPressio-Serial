name: State Monitor

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'optimisation/**'
  pull_request:

jobs:
  esp32-state-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Create integration project
        run: |
          mkdir -p /tmp/serial-state-monitor/src
          cat > /tmp/serial-state-monitor/platformio.ini <<'EOF'
          [env:esp32dev]
          platform = espressif32
          board = esp32dev
          framework = arduino
          lib_deps =
              file://${{ github.workspace }}
              https://github.com/ESPressio-Development-Platform/ESPressio-State.git#feature/1-state-foundation
          build_unflags = -std=gnu++11
          build_flags = -std=gnu++17
          EOF
          cat > /tmp/serial-state-monitor/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <ESPressio_State.hpp>
          #include <ESPressio_StateMonitor.hpp>

          struct LedState {
              using Value = bool;
              static constexpr ESPressio::State::StateTypeId Id = 1;
          };

          using Contract = ESPressio::State::StateContract<LedState>;
          ESPressio::State::RemoteStateManager<Contract, 2> remoteState;
          ESPressio::State::StateSubscriptionRegistry<2> subscriptions;
          ESPressio::State::StateSubscriberRegistry<Contract, 2> subscribers;
          ESPressio::State::StatePublisher<Contract> publisher;
          ESPressio::State::StatePublicationTracker<LedState> publication;
          ESPressio::Serial::StateMonitor monitor;

          void setup() {
              Serial.begin(115200);
              monitor.ObserveRemoteState(remoteState, Serial);
              monitor.ObserveSubscriptions(subscriptions, Serial);
              monitor.ObserveSubscribers(subscribers, Serial);
              monitor.ObservePublisher(publisher, Serial);
              monitor.ObservePublications(publication, Serial);
          }

          void loop() {}
          EOF
      - name: Compile optional State monitor
        run: pio run -d /tmp/serial-state-monitor
