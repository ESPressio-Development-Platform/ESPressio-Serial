name: Repository Migration Normalizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.head_ref == 'maintenance/28-repository-migration' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/28-repository-migration
      - name: Normalize non-workflow repository identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = [
              ('https://github.com/Flowduino/', 'https://github.com/ESPressio-Development-Platform/'),
              ('https://github.com/flowduino/', 'https://github.com/ESPressio-Development-Platform/'),
              ('Flowduino/ESPressio-', 'ESPressio-Development-Platform/ESPressio-'),
              ('flowduino/ESPressio-', 'espressio-development-platform/ESPressio-'),
              ('Flowduino ESPressio Development Platform', 'ESPressio Development Platform'),
              ('https://flowduino.com', 'https://espressio.org'),
              ('http://flowduino.com', 'https://espressio.org'),
              ('Copyright 2026 Flowduino', 'Copyright 2026 Simon J. Stuart'),
          ]
          changed=[]
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.github' in path.parts:
                  continue
              try:
                  text=path.read_text(encoding='utf-8')
              except (UnicodeDecodeError,OSError):
                  continue
              updated=text
              for old,new in replacements:
                  updated=updated.replace(old,new)
              if updated != text:
                  path.write_text(updated,encoding='utf-8')
                  changed.append(str(path))
          print('Changed files:')
          for p in changed: print(p)
          PY
      - name: Report residual legacy references outside workflows
        shell: bash
        run: grep -R -n -i 'flowduino' . --exclude-dir=.git --exclude-dir=.github || true
      - name: Commit normalized non-workflow files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Complete Serial repository identity migration (#28)'
          git push
