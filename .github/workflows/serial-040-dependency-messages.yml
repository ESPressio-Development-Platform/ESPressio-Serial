name: Serial 0.4.0 Dependency Messages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/serial-040-dependency-messages.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/event-console/ESPressio_EventConsole.hpp')
          s=p.read_text().replace('ESPressio Event >= 5.6.1.', 'ESPressio Event >= 5.7.1 < 6.0.0.').replace('ESPressio Serializable >= 0.9.0 < 1.0.0', 'ESPressio Serializable >= 0.10.0 < 1.0.0')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/event-console/ESPressio_EventConsole.hpp
          git commit -m "docs: align EventConsole dependency baselines"
          git push origin HEAD:main
