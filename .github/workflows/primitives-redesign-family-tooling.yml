name: Primitive Family Tooling Contract

on:
  push:
    branches: [primitives_redesign]
    paths:
      - 'src/command-console/**'
      - 'src/command/ESPressio_CommandMonitor.hpp'
      - 'src/event-console/**'
      - 'src/event/ESPressio_EventMonitor.hpp'
      - 'src/state/ESPressio_StateMonitor.hpp'
      - 'tests/test_primitive_family_tooling.cpp'
      - '.github/workflows/primitives-redesign-family-tooling.yml'
  pull_request:
    paths:
      - 'src/command-console/**'
      - 'src/command/ESPressio_CommandMonitor.hpp'
      - 'src/event-console/**'
      - 'src/event/ESPressio_EventMonitor.hpp'
      - 'src/state/ESPressio_StateMonitor.hpp'
      - 'tests/test_primitive_family_tooling.cpp'
      - '.github/workflows/primitives-redesign-family-tooling.yml'

permissions:
  contents: read

jobs:
  family-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: ESPressio-Serial}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-System, ref: primitives_redesign, path: deps/ESPressio-System}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Primitive, ref: primitives_redesign, path: deps/ESPressio-Primitive}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Command, ref: primitives_redesign, path: deps/ESPressio-Command}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Event, ref: primitives_redesign, path: deps/ESPressio-Event}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-State, ref: primitives_redesign, path: deps/ESPressio-State}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Task, ref: primitives_redesign, path: deps/ESPressio-Task}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Threads, ref: primitives_redesign, path: deps/ESPressio-Threads}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Timing, ref: primitives_redesign, path: deps/ESPressio-Timing}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Serializable, ref: primitives_redesign, path: deps/ESPressio-Serializable}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Units, ref: primitives_redesign, path: deps/ESPressio-Units}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Observable, ref: primitives_redesign, path: deps/ESPressio-Observable}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Persistence, ref: primitives_redesign, path: deps/ESPressio-Persistence}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Security, ref: primitives_redesign, path: deps/ESPressio-Security}

      - name: Reject predecessor family tooling APIs
        shell: bash
        run: |
          files=(
            ESPressio-Serial/src/command-console/ESPressio_CommandConsole.hpp
            ESPressio-Serial/src/command/ESPressio_CommandMonitor.hpp
            ESPressio-Serial/src/event-console/ESPressio_EventConsole.hpp
            ESPressio-Serial/src/event/ESPressio_EventMonitor.hpp
            ESPressio-Serial/src/state/ESPressio_StateMonitor.hpp
          )
          if grep -nE 'Command::CommandRegistry|Command::CommandRequestEnvelope|Event::InboundCommandEvent|CommandResponseRouteRegistry|Event::EventTransportManager|Event::IEventTransport|State::IRemoteStateManagerObserver|State::StateOwner|SetByTypeId' "${files[@]}"; then
            exit 1
          fi

      - name: Build D10-12 family tooling contract
        shell: bash
        run: |
          includes=(-I ESPressio-Serial/src)
          for dep in System Primitive Command Event State Task Threads Timing Serializable Units Observable Persistence Security; do
            includes+=( -I "deps/ESPressio-${dep}/src" )
          done
          includes+=( -I deps/ESPressio-Timing/tests/stubs -I deps/ESPressio-Task/tests )
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -fno-rtti -UNDEBUG \
            "${includes[@]}" \
            ESPressio-Serial/tests/test_primitive_family_tooling.cpp \
            -pthread -o family-tooling-test

      - name: Run D10-12 family tooling contract
        run: ./family-tooling-test
