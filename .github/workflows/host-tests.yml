name: Host Tests

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Serial
        uses: actions/checkout@v4
      - name: Checkout ESPressio System working branch
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: main
          path: deps/ESPressio-System
      - name: Checkout asynchronous ESPressio Command branch
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Command
          ref: main
          path: deps/ESPressio-Command
      - name: Checkout ESPressio Observable working branch
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          ref: main
          path: deps/ESPressio-Observable
      - name: Checkout ESPressio Serializable working branch
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Serializable
          ref: main
          path: deps/ESPressio-Serializable
      - name: Checkout ESPressio WiFi working branch
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-WiFi
          ref: main
          path: deps/ESPressio-WiFi
      - name: Configure
        run: >-
          cmake -S tests -B build
          -DESPRESSIO_SYSTEM_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-System/src"
          -DESPRESSIO_COMMAND_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Command/src"
          -DESPRESSIO_OBSERVABLE_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Observable/src"
          -DESPRESSIO_SERIALIZABLE_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Serializable/src"
          -DESPRESSIO_WIFI_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-WiFi/src"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  esp32-observable-monitors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Serial
        uses: actions/checkout@v4
        with:
          path: project/ESPressio-Serial
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-System, ref: main, path: project/dependencies/ESPressio-System}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Task, ref: main, path: project/dependencies/ESPressio-Task}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Observable, ref: main, path: project/dependencies/ESPressio-Observable}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Serializable, ref: main, path: project/dependencies/ESPressio-Serializable}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Units, ref: main, path: project/dependencies/ESPressio-Units}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Timing, ref: main, path: project/dependencies/ESPressio-Timing}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Threads, ref: main, path: project/dependencies/ESPressio-Threads}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Event, ref: main, path: project/dependencies/ESPressio-Event}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Command, ref: main, path: project/dependencies/ESPressio-Command}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Security, ref: main, path: project/dependencies/ESPressio-Security}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Persistence, ref: main, path: project/dependencies/ESPressio-Persistence}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Sockets, ref: main, path: project/dependencies/ESPressio-Sockets}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-ESP-Now, ref: main, path: project/dependencies/ESPressio-ESP-Now}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-WiFi, ref: main, path: project/dependencies/ESPressio-WiFi}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Create monitor compile project
        shell: bash
        run: |
          mkdir -p project/compile/src
          cat > project/compile/network_include.py <<'EOF'
          Import("env")
          framework = env.PioPlatform().get_package_dir("framework-arduinoespressif32")
          env.Append(CPPPATH=[
              framework + "/libraries/Network/src",
              framework + "/libraries/WiFi/src",
              framework + "/libraries/NetworkClientSecure/src"
          ])
          EOF
          cat > project/compile/platformio.ini <<'EOF'
          [env:esp32]
          platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
          board = esp32dev
          framework = arduino
          extra_scripts = pre:network_include.py
          build_flags =
              -std=gnu++17
              -frtti
              -I../dependencies/ESPressio-Command/src
              -I../dependencies/ESPressio-Security/src
              -I../dependencies/ESPressio-Persistence/src
              -I../dependencies/ESPressio-Sockets/src
              -I../dependencies/ESPressio-ESP-Now/src
              -I../dependencies/ESPressio-WiFi/src
          build_unflags =
              -std=gnu++11
              -fno-rtti
          lib_ldf_mode = deep+
          lib_deps =
              ../dependencies/ESPressio-System
              ../dependencies/ESPressio-Task
              ../dependencies/ESPressio-Observable
              ../dependencies/ESPressio-Serializable
              ../dependencies/ESPressio-Units
              ../dependencies/ESPressio-Timing
              ../dependencies/ESPressio-Threads
              ../dependencies/ESPressio-Event
              ../dependencies/ESPressio-Command
              ../dependencies/ESPressio-Security
              ../dependencies/ESPressio-Persistence
              ../dependencies/ESPressio-Sockets
              ../dependencies/ESPressio-ESP-Now
              ../dependencies/ESPressio-WiFi
              ../ESPressio-Serial
          EOF
          cat > project/compile/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <Network.h>
          #include <WiFi.h>
          #include <ESPressio_CommandMonitor.hpp>
          #include <ESPressio_SecurityMonitor.hpp>
          #include <ESPressio_SocketWorkerMonitor.hpp>
          #include <ESPressio_SocketSecuritySessionMonitor.hpp>
          #include <ESPressio_ESPNowTransportMonitor.hpp>
          #include <ESPressio_EventMonitor.hpp>
          #include <ESPressio_WiFiMonitor.hpp>
          #include <event/ESPressio_EventMonitorPayloadSafety.hpp>
          void setup() {}
          void loop() {}
          EOF
      - name: Compile ESP32 monitor integrations against coordinated cascade
        run: pio run -d project/compile
