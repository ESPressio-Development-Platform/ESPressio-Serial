name: Host Tests

on:
  push:
    branches: [primitives_redesign]
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Serial
        uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-System, ref: primitives_redesign, path: deps/ESPressio-System}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Logging, ref: primitives_redesign, path: deps/ESPressio-Logging}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Primitive, ref: primitives_redesign, path: deps/ESPressio-Primitive}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Command, ref: primitives_redesign, path: deps/ESPressio-Command}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Event, ref: primitives_redesign, path: deps/ESPressio-Event}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-State, ref: primitives_redesign, path: deps/ESPressio-State}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Task, ref: primitives_redesign, path: deps/ESPressio-Task}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Threads, ref: primitives_redesign, path: deps/ESPressio-Threads}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Timing, ref: primitives_redesign, path: deps/ESPressio-Timing}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Units, ref: primitives_redesign, path: deps/ESPressio-Units}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Observable, ref: primitives_redesign, path: deps/ESPressio-Observable}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Serializable, ref: primitives_redesign, path: deps/ESPressio-Serializable}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Persistence, ref: primitives_redesign, path: deps/ESPressio-Persistence}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Security, ref: primitives_redesign, path: deps/ESPressio-Security}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-WiFi, ref: primitives_redesign, path: deps/ESPressio-WiFi}

      - name: Reject predecessor family test architecture
        shell: bash
        run: |
          if grep -R -nE 'CommandRegistry|CommandRequestEnvelope|InboundCommandEvent|CommandResponseRouteRegistry|EventTransportManager|IEventTransport' \
              tests/test_command_console.cpp tests/test_event_console.cpp tests/test_primitive_family_tooling.cpp; then
            echo 'Aggregate Serial tests still encode predecessor family architecture.' >&2
            exit 1
          fi
          test ! -e src/event/ESPressio_EventMonitorFormatter.hpp
          test ! -e src/event/ESPressio_EventMonitorPayloadSafety.hpp
          test ! -e tests/stubs/ESPressio_CommandEvents.hpp
          test ! -e tests/stubs/ESPressio_EventTransport.hpp

      - name: Configure
        run: >-
          cmake -S tests -B build
          -DESPRESSIO_SYSTEM_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-System/src"
          -DESPRESSIO_LOGGING_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Logging/src"
          -DESPRESSIO_PRIMITIVE_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Primitive/src"
          -DESPRESSIO_COMMAND_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Command/src"
          -DESPRESSIO_EVENT_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Event/src"
          -DESPRESSIO_STATE_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-State/src"
          -DESPRESSIO_TASK_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Task/src"
          -DESPRESSIO_THREADS_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Threads/src"
          -DESPRESSIO_TIMING_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Timing/src"
          -DESPRESSIO_UNITS_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Units/src"
          -DESPRESSIO_OBSERVABLE_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Observable/src"
          -DESPRESSIO_SERIALIZABLE_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Serializable/src"
          -DESPRESSIO_PERSISTENCE_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Persistence/src"
          -DESPRESSIO_SECURITY_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Security/src"
          -DESPRESSIO_WIFI_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-WiFi/src"
          -DESPRESSIO_TIMING_TEST_STUB_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Timing/tests/stubs"
          -DESPRESSIO_TASK_TEST_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Task/tests"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
