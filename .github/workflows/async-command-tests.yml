name: Command Console Final Contract

on:
  push:
    branches: [primitives_redesign]
  pull_request:

permissions:
  contents: read

jobs:
  command-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: ESPressio-Serial}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-System, ref: primitives_redesign, path: deps/ESPressio-System}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Primitive, ref: primitives_redesign, path: deps/ESPressio-Primitive}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Command, ref: primitives_redesign, path: deps/ESPressio-Command}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Task, ref: primitives_redesign, path: deps/ESPressio-Task}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Timing, ref: primitives_redesign, path: deps/ESPressio-Timing}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Units, ref: primitives_redesign, path: deps/ESPressio-Units}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Observable, ref: primitives_redesign, path: deps/ESPressio-Observable}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Serializable, ref: primitives_redesign, path: deps/ESPressio-Serializable}

      - name: Reject predecessor Command console APIs
        shell: bash
        run: |
          files=(
            ESPressio-Serial/src/command-console/ESPressio_CommandConsole.hpp
            ESPressio-Serial/tests/test_command_console.cpp
          )
          if grep -nE 'CommandRegistry|CommandRequestEnvelope|InboundCommandEvent|CommandResponseRouteRegistry|TextCommandParser' "${files[@]}"; then
            echo 'Command console regression still references predecessor Command/Event routing architecture.' >&2
            exit 1
          fi
          grep -q 'SubmitDynamicCommand' ESPressio-Serial/src/command-console/ESPressio_CommandConsole.hpp
          grep -q 'RequesterRequired' ESPressio-Serial/src/command-console/ESPressio_CommandConsole.hpp
          grep -q 'ICommandConsoleAuthorizer' ESPressio-Serial/src/command-console/ESPressio_CommandConsole.hpp

      - name: Compile final Command console regression
        shell: bash
        run: |
          includes=(-I ESPressio-Serial/src)
          for dep in System Primitive Command Task Timing Units Observable Serializable; do
            includes+=( -I "deps/ESPressio-${dep}/src" )
          done
          includes+=( -I deps/ESPressio-Timing/tests/stubs -I deps/ESPressio-Task/tests )
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -fno-rtti -UNDEBUG \
            "${includes[@]}" \
            ESPressio-Serial/tests/test_command_console.cpp \
            -pthread -o command-console-test

      - name: Run final Command console regression
        run: ./command-console-test
