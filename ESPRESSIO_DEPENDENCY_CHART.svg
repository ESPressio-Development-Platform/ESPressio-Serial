  <rect class="node" x="250" y="225" width="180" height="55"/><text class="label" x="340" y="253">Timing 2.2.4</text>
  <rect class="node" x="570" y="225" width="180" height="55"/><text class="label" x="660" y="253">Threads 3.1.4</text>
  <path class="edge" d="M340 225 L505 155"/><path class="edge" d="M320 225 L150 155"/><path class="edge" d="M660 225 L400 155"/><path class="edge" d="M630 225 L180 155"/>
  <text x="40" y="330" class="group">Transport / Event</text>
  <rect class="node" x="90" y="350" width="170" height="55"/><text class="label" x="175" y="378">Sockets 0.5.0</text>
  <rect class="node" x="320" y="350" width="190" height="55"/><text class="label" x="415" y="378">ESP-Now 0.5.3</text>
  <rect class="node" x="610" y="350" width="180" height="55"/><text class="label" x="700" y="378">Event 5.8.4</text>
  <path class="edge" d="M700 350 L660 280"/><path class="edge" d="M675 350 L390 280"/><path class="edge optional" d="M665 350 L365 155"/><path class="edge optional" d="M610 375 L510 375"/>
