<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680">
  <style>
    text { font-family: sans-serif; fill: #111; }
    .title { font-size: 28px; font-weight: 700; }
    .group { font-size: 15px; font-weight: 700; }
    .node { fill: #fff; stroke: #222; stroke-width: 2; rx: 8; }
    .label { font-size: 16px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
    .edge { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .optional { stroke-dasharray: 7 6; }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
  <text x="40" y="45" class="title">ESPressio Dependency Chart — Serial 0.5.2</text>
  <text x="40" y="80" class="group">Foundational</text>
  <rect class="node" x="40" y="100" width="170" height="55"/><text class="label" x="125" y="128">Observable 3.0.1</text>
  <rect class="node" x="230" y="100" width="180" height="55"/><text class="label" x="320" y="128">Serializable 0.10.2</text>
  <rect class="node" x="430" y="100" width="150" height="55"/><text class="label" x="505" y="128">Units 0.2.3</text>
  <rect class="node" x="600" y="100" width="160" height="55"/><text class="label" x="680" y="128">Security 0.2.0</text>
  <rect class="node" x="780" y="100" width="170" height="55"/><text class="label" x="865" y="128">Command 0.3.0</text>
