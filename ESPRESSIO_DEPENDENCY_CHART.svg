  <path class="edge optional" d="M450 485 L200 405"/><path class="edge optional" d="M475 485 L415 405"/><path class="edge optional" d="M525 485 L700 405"/><path class="edge optional" d="M550 485 L865 155"/><path class="edge optional" d="M570 485 L680 155"/><path class="edge optional" d="M430 485 L340 280"/><path class="edge optional" d="M590 485 L660 280"/><path class="edge optional" d="M410 500 L320 155"/>
  <text x="40" y="620" font-size="14">Solid arrows: required by the source component. Dashed arrows: optional integration/validation relationships.</text>
  <text x="40" y="648" font-size="14">Serial core remains dependency-free; all ESPressio edges into Serial are opt-in.</text>
</svg>
